aid: everestlabs
name: EverestLabs
description: 'EverestLabs builds AI, computer vision, and robotics for the recycling
  industry. Its RecycleOS platform identifies, tracks, and sorts recoverable materials
  on the conveyor lines of Materials Recovery Facilities (MRFs), giving recyclers,
  reclaimers, and packaging manufacturers analytics, bale tracing, plant optimization,
  and compliance reporting to increase recovery rates, cut labor costs, and verify
  recycled content. Headquartered in Fremont, California and backed by Sierra Ventures.
  EverestLabs does not currently publish a public developer API, SDK, or developer
  portal; this profile captures its public web, GitHub, and discovery surface.'
